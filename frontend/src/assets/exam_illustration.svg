<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Exam paper illustration -->
  <rect x="80" y="60" width="240" height="180" fill="white" stroke="#dee2e6" stroke-width="2" rx="8"/>
  
  <!-- Paper lines -->
  <line x1="100" y1="90" x2="300" y2="90" stroke="#e9ecef" stroke-width="1"/>
  <line x1="100" y1="110" x2="280" y2="110" stroke="#e9ecef" stroke-width="1"/>
  <line x1="100" y1="130" x2="290" y2="130" stroke="#e9ecef" stroke-width="1"/>
  <line x1="100" y1="150" x2="270" y2="150" stroke="#e9ecef" stroke-width="1"/>
  <line x1="100" y1="170" x2="285" y2="170" stroke="#e9ecef" stroke-width="1"/>
  <line x1="100" y1="190" x2="295" y2="190" stroke="#e9ecef" stroke-width="1"/>
  <line x1="100" y1="210" x2="260" y2="210" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Pen illustration -->
  <rect x="310" y="140" width="4" height="60" fill="#1976d2" rx="2"/>
  <polygon points="310,140 314,140 312,130" fill="#1976d2"/>
  
  <!-- Clock illustration -->
  <circle cx="120" cy="40" r="15" fill="white" stroke="#1976d2" stroke-width="2"/>
  <line x1="120" y1="40" x2="120" y2="30" stroke="#1976d2" stroke-width="2"/>
  <line x1="120" y1="40" x2="125" y2="40" stroke="#1976d2" stroke-width="2"/>
  
  <!-- Title text -->
  <text x="200" y="270" text-anchor="middle" fill="#1976d2" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Smart Examination</text>
</svg>